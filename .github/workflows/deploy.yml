name: Build and Deploy to AlwaysData

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet de lancer manuellement le workflow

env:
  NODE_VERSION: "24"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    container:
      image: debian:12

    steps:
      # =====================================================
      # 1. CHECKOUT CODE
      # =====================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. SETUP NODE.JS
      # =====================================================
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # =====================================================
      # 3. BUILD FRONTEND
      # =====================================================
      - name: 📦 Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: ✅ Verify frontend build
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "❌ Frontend dist directory not found!"
            exit 1
          fi
          echo "✅ Frontend built successfully"
          ls -la frontend/dist

      - name: 🔎 Check required GLIBC version
        run: |
          echo "Build environment glibc:"
          ldd --version | head -n1

          echo "Required GLIBC symbols:"
          strings target/release/voxicraft-auth-backend | grep GLIBC_ | sort -V | tail -20

      - name: Initialize system dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            curl \
            git \
            ca-certificates \
            pkg-config \
            libssl-dev

      # =====================================================
      # 4. SETUP RUST
      # =====================================================
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # =====================================================
      # 5. BUILD BACKEND
      # =====================================================
      - name: 🏗️ Build backend (release mode)
        working-directory: .
        run: cargo build --features embed-frontend --release

      - name: ✅ Verify backend build
        run: |
          if [ ! -f "target/release/voxicraft-auth-backend" ]; then
            echo "❌ Backend binary not found!"
            exit 1
          fi
          echo "✅ Backend built successfully"
          ls -lh target/release/voxicraft-auth-backend

      # =====================================================
      # 6. RUN MIGRATIONS (optionnel - décommenter si nécessaire)
      # =====================================================
      - name: 🗄️ Run database migrations
        working-directory: .
        env:
           DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
           ./target/release/migration up

      # =====================================================
      # 7. PREPARE DEPLOYMENT PACKAGE
      # =====================================================
      - name: 📦 Create deployment package
        run: |
          mkdir -p deploy
          cp target/release/voxicraft-auth-backend deploy/
          cp backend/.env.production deploy/.env || echo "No .env.production file"
          chmod +x deploy/voxicraft-auth-backend
          echo "✅ Deployment package created"
          ls -lh deploy/

      # =====================================================
      # 8. BACKUP CURRENT VERSION
      # =====================================================
      - name: 💾 Backup current version on server
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.ALWAYSDATA_HOST }}
          username: ${{ secrets.ALWAYSDATA_USER }}
          password: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          script: |
            cd ${{ secrets.ALWAYSDATA_DEPLOY_PATH }}
            if [ -f voxicraft-auth-backend ]; then
              mv voxicraft-auth-backend voxicraft-auth-backend.backup.$(date +%Y%m%d_%H%M%S)
              echo "✅ Previous version backed up"
            else
              echo "ℹ️ No previous version to backup"
            fi

      # =====================================================
      # 9. DEPLOY FILES TO ALWAYSDATA VIA SCP
      # =====================================================
      - name: 🚀 Upload files to AlwaysData
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALWAYSDATA_HOST }}
          username: ${{ secrets.ALWAYSDATA_USER }}
          password: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          source: "deploy/*"
          target: ${{ secrets.ALWAYSDATA_DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: ✅ Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALWAYSDATA_HOST }}
          username: ${{ secrets.ALWAYSDATA_USER }}
          password: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          script: |
            cd ${{ secrets.ALWAYSDATA_DEPLOY_PATH }}
            chmod +x voxicraft-auth-backend
            ls -lh voxicraft-auth-backend
            echo "✅ Files deployed successfully"

      # =====================================================
      # 10. RUN MIGRATIONS ON SERVER (si nécessaire)
      # =====================================================
      # - name: 🗄️ Run migrations on server
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.ALWAYSDATA_HOST }}
      #     username: ${{ secrets.ALWAYSDATA_USER }}
      #     key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
      #     script: |
      #       cd ${{ secrets.ALWAYSDATA_DEPLOY_PATH }}
      #       ./voxicraft-auth-backend migrate

      # =====================================================
      # 11. RESTART SERVER VIA ALWAYSDATA API
      # =====================================================
      - name: 🔄 Restart server via AlwaysData API
        run: |
          chmod +x restart_server.sh
          ./restart_server.sh

      # =====================================================
      # 11. HEALTH CHECK
      # =====================================================
      - name: 🏥 Health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "⏳ Waiting for application to start..."
          sleep 10

          max_retries=5
          retry=0

          while [ $retry -lt $max_retries ]; do
            echo "🔍 Attempt $((retry + 1))/$max_retries"

            http_code=$(curl -s -o /dev/null -w "%{http_code}" $APP_URL)

            if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 301 ] || [ "$http_code" -eq 302 ]; then
              echo "✅ Application is healthy (HTTP $http_code)"
              exit 0
            fi

            echo "⚠️ Application not ready yet (HTTP $http_code)"
            retry=$((retry + 1))
            sleep 5
          done

          echo "❌ Health check failed after $max_retries attempts"
          exit 1

      # =====================================================
      # 12. NOTIFICATION (optionnel)
      # =====================================================
      - name: 📢 Notify deployment success
        if: success()
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "Version: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed at: $(date)"

      - name: 📢 Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Check logs for details"

  # =====================================================
  # JOB 2: ROLLBACK (Manuel uniquement)
  # =====================================================
  rollback:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-deploy
    environment:
      name: rollback

    steps:
      - name: 🔙 Rollback to previous version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALWAYSDATA_HOST }}
          username: ${{ secrets.ALWAYSDATA_USER }}
          password: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          script: |
            cd ${{ secrets.ALWAYSDATA_DEPLOY_PATH }}
            backup=$(ls -t voxicraft-auth-backend.backup.* 2>/dev/null | head -n1)
            if [ -n "$backup" ]; then
              mv voxicraft-auth-backend voxicraft-auth-backend.failed
              mv $backup voxicraft-auth-backend
              chmod +x voxicraft-auth-backend
              echo "✅ Rolled back to: $backup"
            else
              echo "❌ No backup found"
              exit 1
            fi

      - name: 🔄 Restart after rollback
        env:
          ALWAYSDATA_API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
          ALWAYSDATA_ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
          ALWAYSDATA_SITE_ID: ${{ secrets.ALWAYSDATA_SITE_ID }}
        run: |
          echo "🔄 Restarting application after rollback..."

          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -u "$ALWAYSDATA_ACCOUNT:$ALWAYSDATA_API_KEY" \
            "https://api.alwaysdata.com/v1/site/$ALWAYSDATA_SITE_ID/restart/")

          http_code=$(echo "$response" | tail -n1)

          if [ "$http_code" -eq 200 ] || [ "$http_code" -eq 204 ]; then
            echo "✅ Server restarted successfully after rollback"
          else
            echo "⚠️ Failed to restart server (HTTP $http_code)"
          fi
