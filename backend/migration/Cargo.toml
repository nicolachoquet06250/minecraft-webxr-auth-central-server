[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }
sea-orm-migration = { version = "0.12", default-features = false, features = [
    "sqlx-mysql",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

# Keep sqlx 0.7.x on a compatible time release.
# Newer time 0.3.x releases can trigger conflicting trait impls in sqlx-core 0.7.4.
time = "=0.3.36"

dotenvy = "0.15"
