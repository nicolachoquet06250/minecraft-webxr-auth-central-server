[package]
name = "voxicraft-auth-backend"
version = "0.1.0"
edition = "2021"

[features]
default = []
embed-frontend = ["dep:include_dir"]

[dependencies]
# Web framework
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database ORM. The selected engine is driven by DATABASE_URL:
# - sqlite://./data/dev.sqlite?mode=rwc for local development
# - mysql://user:password@host:3306/database for production
sea-orm = { version = "0.12", features = ["sqlx-mysql", "sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "0.12", default-features = false, features = ["sqlx-mysql", "sqlx-sqlite", "runtime-tokio-rustls"] }

# Keep sqlx 0.7.x on a compatible time release.
# Newer time 0.3.x releases can trigger conflicting trait impls in sqlx-core 0.7.4.
time = "=0.3.36"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["serde", "v4"] }
rand = "0.8"

# HTTP client for OAuth (using rustls instead of native-tls)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
base64 = "0.22"

# Environment variables
dotenvy = "0.15"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# URL encoding
urlencoding = "2"
url = "2"

# Static file embedding
include_dir = { version = "0.7", optional = true }
mime_guess = "2"
